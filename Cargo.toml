[package]
name = "fennec-ui"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Shared gpui-kit UI pieces for the Fennec desktop and coding-agent GUIs: theme presets, markdown rendering, message widgets, and the workspace-creation dialog."

[lib]
name = "fennec_ui"
path = "src/lib.rs"

[dependencies]
gpui-kit = "0.10.0"
hound = "3.5"
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking", "multipart"], default-features = false }